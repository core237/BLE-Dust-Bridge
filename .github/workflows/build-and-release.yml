name: Build Firmware & Update Installer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build ESP32-S3 Firmware & Factory Image
        run: pio run

      - name: Prepare Release Binaries & Version Tag
        id: meta
        run: |
          cp .pio/build/m5stack-atoms3/firmware.bin firmware.bin
          VER=$(grep -oE 'doc\["fw_version"\]\s*=\s*"[^"]+"' src/web_server.cpp | grep -oE '"[^"]+"' | tail -n 1 | tr -d '"')
          if [ -z "$VER" ]; then VER="1.0.0"; fi
          echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          echo "Detected firmware version: v${VER}"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: BLE Dust Bridge ${{ steps.meta.outputs.tag }}
          prerelease: false
          generate_release_notes: true
          files: |
            firmware.bin
            installer/bldb-factory.bin

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Web Installer Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: installer

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
